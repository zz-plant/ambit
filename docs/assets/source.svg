    <text x="40" y="80" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#8a8e96">An A whose three vertices are graph nodes. Mass, not line art, so it holds at 16px.</text>

