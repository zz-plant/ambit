<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="400" height="200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.12"/>
      <stop offset="50%" stop-color="#ffaa00" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#030712" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="copper" x1="0" y1="0" x2="100%" y2="0">
      <stop offset="0%" stop-color="#ff3300"/>
      <stop offset="50%" stop-color="#ffaa00"/>
      <stop offset="100%" stop-color="#00f0ff"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="#030712"/>
  <rect width="100%" height="100%" fill="url(#bg)"/>
  
  <!-- Subtle grid lines -->
  <line x1="40" y1="100" x2="360" y2="100" stroke="#162840" stroke-width="0.8" stroke-dasharray="3,3" opacity="0.6"/>
  <line x1="200" y1="20" x2="200" y2="180" stroke="#162840" stroke-width="0.8" stroke-dasharray="3,3" opacity="0.6"/>

  <!-- Centered keystone marker symbol -->
  <circle cx="200" cy="55" r="14" fill="#070e1c" stroke="url(#copper)" stroke-width="1.5" filter="url(#glow)"/>
  <text x="200" y="60" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="900" fill="#00f0ff" text-anchor="middle">◈</text>
  
  <!-- Project name -->
  <text x="200" y="98" font-family="'JetBrains Mono', -apple-system, sans-serif" font-size="24"
        font-weight="800" fill="#e2f0fc" text-anchor="middle" letter-spacing="3" filter="url(#glow)">AMBIT</text>
  
  <!-- Accent laser line under name -->
  <line x1="120" y1="114" x2="280" y2="114" stroke="url(#copper)" stroke-width="1.5" filter="url(#glow)"/>
  
  <!-- Subtitle -->
  <text x="200" y="136" font-family="'JetBrains Mono', monospace" font-size="8.5"
        font-weight="600" fill="#8bb2d6" text-anchor="middle" letter-spacing="1">META-MCP CAPABILITY GRAPH FOR AI AGENTS</text>
</svg>