<svg xmlns="http://www.w3.org/2000/svg" width="640" height="720" viewBox="0 0 640 720">
    <defs><linearGradient id="plate" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient><linearGradient id="mk" x1="13" y1="51" x2="51" y2="12" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient></defs>
    <rect width="640" height="720" fill="#090d16"/>

    <text x="40" y="56" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#f8fafc" letter-spacing="1.4">AMBIT — MARK</text>
    <text x="40" y="80" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#7b8799">An A whose three vertices are graph nodes. Mass, not line art, so it holds at 16px.</text>

    <g transform="translate(40, 112) scale(1.5)">
    <g stroke="url(#mk)" stroke-linecap="round" fill="none">
      <path d="M13 51 L32 12" stroke-width="9.5"/>
      <path d="M51 51 L32 12" stroke-width="9.5"/>
      <path d="M20 40 H44" stroke-width="8.5"/>
    </g>
    <circle cx="32" cy="12" r="8.5" fill="url(#mk)"/>
    <circle cx="13" cy="51" r="7.5" fill="url(#mk)"/>
    <circle cx="51" cy="51" r="7.5" fill="url(#mk)"/></g>
    <text x="40" y="248" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#cbd5e1">unplated</text>
    <text x="40" y="266" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#61708a">on the dark ground: the card, and in-app</text>
    <g transform="translate(260, 112) scale(1.5)"><rect width="64" height="64" rx="14" fill="url(#plate)"/>
    <g stroke="#ffffff" stroke-linecap="round" fill="none">
      <path d="M13 51 L32 12" stroke-width="9.5"/>
      <path d="M51 51 L32 12" stroke-width="9.5"/>
      <path d="M20 40 H44" stroke-width="8.5"/>
    </g>
    <circle cx="32" cy="12" r="8.5" fill="#ffffff"/>
    <circle cx="13" cy="51" r="7.5" fill="#ffffff"/>
    <circle cx="51" cy="51" r="7.5" fill="#ffffff"/></g>
    <text x="260" y="248" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#cbd5e1">plated</text>
    <text x="260" y="266" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#61708a">favicon and touch icon</text>

    <text x="40" y="306" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#cbd5e1">Shipped sizes</text>
    <text x="40" y="324" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#61708a">16px is a browser tab, 32px a bookmark, 180px an iOS home screen.</text>
