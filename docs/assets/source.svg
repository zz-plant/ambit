    <text x="504" y="664" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#61708a">#090d16</text>

    <text x="40" y="700" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#61708a">What you, your agents, and your machines can jointly do — and where your own time is going.</text>
