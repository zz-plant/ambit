<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5C6BC0" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#7986CB" stop-opacity="0.06"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="#1a1a2e"/>
  <rect width="100%" height="100%" fill="url(#bg)"/>
  
  <!-- Project marker dot -->
  <circle cx="400" cy="200" r="4" fill="#5C6BC0" filter="url(#glow)" opacity="0.6"/>
  
  <!-- Project name -->
  <text x="400" y="250" font-family="system-ui, -apple-system, sans-serif" font-size="48"
        font-weight="700" fill="white" text-anchor="middle" letter-spacing="2"
        opacity="0.9">toolchain</text>
  
  <!-- Subtitle -->
  <text x="400" y="290" font-family="system-ui, -apple-system, sans-serif" font-size="14"
        font-weight="300" fill="#7986CB" text-anchor="middle" opacity="0.6"
        letter-spacing="1">3D toolchain visualization dashboard</text>
  
  <!-- Accent line -->
  <line x1="300" y1="310" x2="500" y2="310" stroke="#5C6BC0" stroke-width="1" opacity="0.3"/>
</svg>