  <path d="M356 186V226H316V268" class="edge"/>
  <text x="87" y="214" class="detail" style="text-anchor:end">revision</text>
  <text x="392" y="214" class="detail" style="text-anchor:start">context</text>
  <rect x="84" y="268" width="312" height="70" rx="10" class="card"/>
