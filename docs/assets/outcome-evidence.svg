<svg xmlns="http://www.w3.org/2000/svg" width="480" height="506" viewBox="0 0 480 506" role="img" aria-labelledby="title desc">
  <title id="title">Proposed outcome records</title>
  <desc id="desc">An attempt references both a scenario revision defining the target and success criteria, and a setup snapshot recording conditions at execution. The attempt retains acceptance evidence with observed results, source and artifacts. These records are proposed, not shipped schemas.</desc>
  <!-- Authored source; edit this SVG directly. -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#aabbd1" stroke-width="1.5"/></marker>
    <style>
      text{font-family:system-ui,-apple-system,sans-serif;fill:#f1f3f7;text-anchor:middle}
      .heading{font-size:22px;font-weight:650;text-anchor:start}.label{font-size:20px;font-weight:600}.detail{font-size:16px;fill:#c0cbdb}
      .card{fill:#1a202a;stroke:#596b84;stroke-width:1.5}.edge{fill:none;stroke:#aabbd1;stroke-width:2;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="480" height="506" rx="16" fill="#101318"/>
