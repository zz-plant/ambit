# Smithery MCP Server configuration
# https://smithery.ai/docs/config#smitheryyaml

startCommand:
  type: stdio
  configSchema:
    type: object
    properties:
      profile:
        type: string
        default: "agent"
        description: "Which tools the MCP server advertises: 'agent' (10 tools for an agent that asks before it acts) or 'full' (every tool)"
        enum:
          - "agent"
          - "full"
  commandFunction: |-
    (config) => ({
      command: 'npx',
      args: ['-y', 'ambit-cli', 'mcp', ...(config?.profile === 'full' ? [] : ['--profile=agent'])],
    })
  exampleConfig:
    profile: "agent"
