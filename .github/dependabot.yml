version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    # A version must be public for 7 days before Dependabot proposes it, so a
    # compromised release has time to be found and pulled before the weekly
    # steward merges it (AGENTS.md, maintenance mode). Security updates are
    # not delayed.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    # One pull request a month for every patch and minor bump, instead of
    # one per package: five landed on one day for patch releases alone.
    # Monthly since 2026-11-10, when Ambit went into maintenance (AGENTS.md).
    # A major version still comes on its own, since it is the one to read.
    groups:
      npm-minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ["*"]
