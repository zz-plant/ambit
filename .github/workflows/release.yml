name: Release

# Releasing was entirely manual: tag, write notes, then hand-edit the Homebrew
# tap's url, version and checksum. Every manual step is a step that gets skipped,
# which is how the tap drifts behind the repo and how the formula ended up with
# no sha256 at all. Pushing a v* tag now does the mechanical parts.
#
# The tag was the step left, and it was skipped too: package.json said 0.7.1
# on main for days while npm served 0.6.0. So a push to main that changes the
# version releases it as well. The guard job tags the commit that set the
# version, and the jobs after it release that tag in the same run; a tag pushed
# with the workflow's token starts no other run. scripts/release-tag.ts says
# how it decides.

on:
  push:
    tags: ['v*']
    # Paths are not evaluated for a tag push, so every v* tag still releases.
    # This file and the guard are listed so a change to how releasing works
    # runs once on merge, which does nothing while the version is tagged.
    branches: [main]
    paths:
      - package.json
      - .github/workflows/release.yml
      - scripts/release-tag.ts
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)publish, e.g. v0.4.1. Leave empty to release main''s version if it has no tag yet.'
        required: false

permissions:
  contents: write

# Runs for main queue one behind another, so two pushes cannot both decide to
# tag the same version. A run for a tag queues only behind runs for that tag.
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  guard:
    # A fork releases only the tags it pushes: on the version path it would
    # tag and release on every sync of main.
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch' || github.repository_owner == 'zz-plant'
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.decide.outputs.release }}
      tag: ${{ steps.decide.outputs.tag }}
    steps:
      # The whole history: the commit that set the version may be far back.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # On a tag, passes it through. On main, tags the commit that set the
      # version when its tag is missing, or says there is nothing to release.
      - name: Decide what to release
        id: decide
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: node --experimental-strip-types scripts/release-tag.ts --push

  release:
    needs: guard
    if: needs.guard.outputs.release == 'true'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      sha256: ${{ steps.meta.outputs.sha256 }}
    steps:
      # The tag, not the commit that started the run: on main that is the
      # commit that set the version, however far main has moved since.
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ needs.guard.outputs.tag }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - run: npm ci

      # A release that fails its own checks should not exist.
      - name: Verify
        run: |
          npm test
          npm run build

      - name: Tag and checksum
        id: meta
        env:
          TAG: ${{ needs.guard.outputs.tag }}
        run: |
          set -euo pipefail
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          # The exact tarball Homebrew downloads, so the checksum is the one the
          # formula needs rather than one computed over something else.
          URL="https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${TAG}.tar.gz"
          curl -fsSL "$URL" -o source.tar.gz
          echo "sha256=$(sha256sum source.tar.gz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Check the version matches the tag
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          if [ "$PKG" != "$TAG" ]; then
            echo "package.json is $PKG but the tag is $TAG — bump one of them."
            exit 1
          fi

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          SHA: ${{ steps.meta.outputs.sha256 }}
        run: |
          # Release notes are written by hand — they explain what changed and
          # why, which nothing here can generate. If a release already exists
          # for this tag, keep its notes and only attach the formula details.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; leaving its notes alone."
          else
            gh release create "$TAG" --title "$TAG" --generate-notes
          fi
          echo "The Homebrew formula is written from the npm tarball by the tap job."

  tap:
    # The formula installs the npm tarball: the same files `npx ambit-cli`
    # runs, built page included. It installed the GitHub source tarball, which
    # has no built page, so `ambit web` from Homebrew had nothing to serve. So
    # this runs after the npm job, and only once that version is on npm.
    needs: [release, npm]
    if: ${{ always() && needs.release.result == 'success' && github.repository_owner == 'zz-plant' }}
    runs-on: ubuntu-latest
    steps:
      - name: Write the Homebrew formula from the npm tarball
        env:
          GH_TOKEN: ${{ secrets.TAP_TOKEN }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          TARBALL="https://registry.npmjs.org/ambit-cli/-/ambit-cli-${VERSION}.tgz"
          if ! curl -fsSL "$TARBALL" -o ambit.tgz; then
            echo "::error::ambit-cli ${VERSION} is not on npm, so the formula has nothing to point at. Publish it, then re-run this job."
            exit 1
          fi
          SHA="$(sha256sum ambit.tgz | cut -d' ' -f1)"
          cat > ambit.rb <<RUBY
          class Ambit < Formula
            desc "What you, your agents, and your machines can jointly do, and where time goes"
            homepage "https://github.com/zz-plant/ambit"
            url "${TARBALL}"
            sha256 "${SHA}"
            license "MIT"

            depends_on "node"

            def install
              system "npm", "install", *std_npm_args
              bin.install_symlink Dir["#{libexec}/bin/*"]
              # The command's old name, kept for anyone who still types it.
              bin.install_symlink libexec/"bin/ambit" => "tt"
            end

            test do
              system bin/"ambit", "--help"
            end
          end
          RUBY
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::No TAP_TOKEN secret, so the tap was not updated. Add one (Contents: write on zz-plant/homebrew-tap) and re-run, or paste this into Formula/ambit.rb:"
            cat ambit.rb
            exit 1
          fi
          git clone "https://x-access-token:${GH_TOKEN}@github.com/zz-plant/homebrew-tap" tap
          cp ambit.rb tap/Formula/ambit.rb
          cd tap
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -am "ambit ${VERSION}"
          git push

  npm:
    needs: release
    runs-on: ubuntu-latest
    # Publishes with npm trusted publishing: npm checks this workflow's
    # identity, so no token is stored. One-time setup on npmjs.com: ambit-cli >
    # Settings > Trusted publisher > GitHub Actions, then zz-plant / ambit /
    # release.yml. A release that cannot publish fails here instead of passing.
    if: ${{ github.repository_owner == 'zz-plant' }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.tag }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Packing compiles the engine and builds the map, which needs the dev
      # dependencies (tsc, vite).
      - run: npm ci
      - name: Publish ambit-cli
        env:
          # A fallback only: trusted publishing needs no token.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # Trusted publishing needs npm 11.5.1 or later; Node 22 ships npm 10.
          npm install -g npm@^11.5.1
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "ambit-cli@$VERSION" version >/dev/null 2>&1; then
            echo "ambit-cli@$VERSION is already on npm; nothing to publish."
            exit 0
          fi
          npm publish --provenance --access public
