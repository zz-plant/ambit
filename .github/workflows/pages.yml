name: Deploy demo

# The live demo was published by hand. Pages is configured in "legacy" mode,
# serving the gh-pages branch at /, so this keeps that arrangement and only
# automates the step that was manual: build, then commit dist/ to that branch.
# Nothing here touches the Pages configuration itself.

on:
  push:
    branches: [main]
    paths:
      - 'src/client/**'
      - 'src/shared/**'
      # The docs are published as pages too, built from these files.
      - 'docs/**'
      - 'README.md'
      - 'SECURITY.md'
      - 'CONTRIBUTING.md'
      - 'CHANGELOG.md'
      - 'scripts/build-docs.ts'
      - 'vite.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The same Node the CI matrix's floor runs, so the build here cannot
      # differ from the one the tests passed on.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Publish to gh-pages
        run: |
          set -e
          # A worktree over the existing branch, rather than a force-push of a
          # fresh history: the branch keeps its past deploys, and a build that
          # changes nothing produces no commit.
          git fetch origin gh-pages
          git worktree add /tmp/pages origin/gh-pages
          # --ignore-times: a plain `-a` rsync can skip files its quick check
          # (size + mtime) deems unchanged. index.html is the same byte length
          # across builds while the hashes it names change, and a skipped
          # index.html is exactly what once shipped a page whose bundles 404'd.
          # Force a content comparison so the entry HTML can never go stale.
          #
          # Assets are copied apart from the rest and never deleted here: a
          # build replaces every hashed filename it had, so a page open across
          # a deploy would ask for files that are gone. They are pruned by the
          # manifest below instead, which keeps the last five builds.
          rsync -a --delete --ignore-times --exclude '.git' --exclude 'assets' dist/ /tmp/pages/
          mkdir -p /tmp/pages/assets
          cd /tmp/pages

          BUILDS=assets/.builds
          if [ ! -s "$BUILDS" ]; then
            # The first run of this rule: whatever is published now is the
            # build before this one, and is kept as such.
            echo "legacy $(ls assets 2>/dev/null | tr '\n' ' ')" > "$BUILDS"
          fi
          rsync -a --ignore-times "$GITHUB_WORKSPACE/dist/assets/" assets/
          echo "${GITHUB_SHA::7} $(ls "$GITHUB_WORKSPACE/dist/assets" | tr '\n' ' ')" >> "$BUILDS"
          tail -n 5 "$BUILDS" > "$BUILDS.new"
          mv "$BUILDS.new" "$BUILDS"

          # Every file any retained build published. Anything else is a build
          # too old to keep, which is where the branch stops growing.
          KEEP=$(cut -d' ' -f2- "$BUILDS" | tr ' ' '\n' | sort -u)
          for f in assets/*; do
            name=${f#assets/}
            printf '%s\n' "$KEEP" | grep -qxF "$name" || rm -f "$f"
          done

          # Coherence gate: every asset index.html names must actually exist in
          # the published tree. A broken deploy fails here instead of shipping a
          # blank page.
          grep -oE 'assets/[A-Za-z0-9._-]+\.(js|css)' /tmp/pages/index.html \
            | sort -u \
            | while read -r f; do
                if [ ! -f "/tmp/pages/$f" ]; then
                  echo "FAIL: index.html references missing asset: $f"
                  exit 1
                fi
              done
          echo "index.html references are coherent."

          git add -A
          if git diff --cached --quiet; then
            echo "Demo unchanged — nothing to deploy."
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m "deploy: ${GITHUB_SHA::7}"
          git push origin HEAD:gh-pages
