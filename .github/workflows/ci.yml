name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # `engines` says >=22.18, and `--experimental-sqlite` appears in 31
        # places across source, scripts and shell. 22 is the floor that claim
        # rests on; 24 is what a new contributor will actually have installed,
        # and on it node:sqlite is stable and the flag is a no-op.
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7

      # One runtime. The engine, the CLI, the API server and the test runner all
      # open the graph through node:sqlite; there is no second driver to keep in
      # step, and nothing in the repo needs Bun.
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      # Covers the engine, the client, and the control plane — whose HMAC
      # approval path used to be tested only by a pytest file no job ran.
      # Coverage runs the same suite, so it replaces the plain test step rather
      # than doubling it. The thresholds are a floor: the engine is well
      # covered, and what they hold is that the client and the two servers do
      # not get worse.
      - name: Test
        run: npm run test:coverage

      - name: Lint and format
        run: npm run lint

      # `build` typechecks first, so this covers both.
      - name: Typecheck and build
        run: npm run build

      # The README's pictures are the first thing a reader sees, and a picture
      # of a UI that no longer exists is worse than no picture.
      - name: Check assets
        run: npm run assets:check

      # Same argument for the console blocks. One of them documented a cascade
      # for an id no graph contains, which is a claim a reader can only check
      # by installing the tool and finding out.
      - name: Check README examples match real output
        run: npm run docs:examples:check

      # The path a new user takes. It must survive a machine with no agent
      # config, which is how it used to fail — with a raw SQLite error.
      - name: Bootstrap on a clean machine
        env:
          OPENCODE_CONFIG: ${{ github.workspace }}/no-such-config.json
        run: ./bootstrap.sh

      # Do not send readers to an install path that the registry cannot serve.
      - name: Check adoption copy
        run: |
          if grep -nE 'npx( -y)? ambit-cli|npm install .*ambit-cli' README.md; then
            echo "README advertises ambit-cli before its npm publication."
            exit 1
          fi
